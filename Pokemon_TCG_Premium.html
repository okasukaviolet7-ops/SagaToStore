<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Pokémon TCG — Ultimate Pack Opening Simulator</title>
<style>
:root{--bg1:#070a1f;--bg2:#1d1050;--accent:#3dc2ff;--gold:#ffd24a;--purple:#8b4dff;--ink:#eaf0ff;--mut:#9aa6cf;
--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.15);--rad:18px;--gcw:clamp(132px,42vw,176px)}
[data-theme="inferno"]{--bg1:#1a0705;--bg2:#4a1208;--accent:#ff8a3d}
[data-theme="ocean"]{--bg1:#031425;--bg2:#0a3563;--accent:#3de0ff}
[data-theme="aurora"]{--bg1:#04160f;--bg2:#241060;--accent:#5dffb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:radial-gradient(1200px 760px at 50% -8%,var(--bg2),var(--bg1) 70%) fixed;overflow-x:hidden;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:90}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* header */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(8,10,30,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ball{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(#ff3b4e 0 44%,#111 44% 56%,#fff 56%);border:3px solid #0a0a14;position:relative;box-shadow:0 0 14px rgba(255,80,100,.55)}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#fff;border:3px solid #0a0a14}
.logo b{display:block;font-size:15px;letter-spacing:.06em;font-weight:900;white-space:nowrap}
.logo small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.chip.coin{color:var(--gold)}
.chip.bump{animation:bump .5s}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}
.ibtn:hover{background:var(--glass2)}
/* nav */
#nav{display:flex;gap:6px;justify-content:center;padding:10px 14px;flex-wrap:wrap}
#nav button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--mut);transition:.2s}
#nav button:hover{color:var(--ink);background:var(--glass2)}
#nav button.on{color:#171000;background:linear-gradient(135deg,#ffe27a,#ffb320);border-color:transparent;box-shadow:0 0 18px rgba(255,200,60,.45)}
.ns{display:none}
#view{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:6px 16px 40px}
.page-in{animation:pageIn .35s ease both}
h1.pt{margin:8px 0 4px;font-size:clamp(22px,5vw,32px);letter-spacing:.04em}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:900;letter-spacing:.05em;font-size:13px;background:var(--glass2);border:1px solid var(--line);transition:transform .15s,box-shadow .2s,filter .2s;min-height:44px;text-align:center}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.pri{color:#1c1300;background:linear-gradient(135deg,#fff0a0,#ffc928 55%,#ff9d1c);border-color:transparent;box-shadow:0 6px 22px rgba(255,190,40,.45)}
.btn.blue{background:linear-gradient(135deg,#5ad0ff,#3a6bff);border-color:transparent;color:#fff}
.btn.danger{background:linear-gradient(135deg,#ff6b6b,#c21f3a);border-color:transparent;color:#fff}
.btn.xl{font-size:17px;padding:15px 34px;min-height:54px}
.btn.poor{opacity:.55;filter:grayscale(.5)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:12px}
/* home */
.hero{position:relative;text-align:center;padding:10px 0 18px}
.hero-glow{position:absolute;left:50%;top:38%;width:min(560px,100%);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--rgb),.5),transparent 62%);filter:blur(10px);animation:pulse 3.5s ease-in-out infinite;pointer-events:none}
.hero-row{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.hero-pack{--pw:clamp(170px,52vw,250px);padding:22px 0 14px;animation:floaty 4s ease-in-out infinite}
.hero-pack .pack{cursor:pointer}
.hero-pack .pack:hover{filter:drop-shadow(0 0 28px rgba(var(--rgb),.85)) drop-shadow(0 18px 24px rgba(0,0,0,.5))}
.car{width:44px;height:44px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);font-size:26px;line-height:1;flex:none}
.hero-name{position:relative;margin:4px 0 2px;font-size:clamp(22px,5vw,30px);letter-spacing:.05em}
.hero-desc{position:relative;color:var(--mut);margin:0 auto 10px;max-width:480px;font-size:14px;padding:0 8px}
.chips{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.dots{position:relative;display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);padding:0;transition:.2s}
.dot.on{background:var(--gold);width:26px;border-radius:6px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 18px}
.menu-grid .btn{padding:16px 10px;flex-direction:column;gap:4px;font-size:13px}
.menu-grid .btn span{font-size:24px}
.daily{padding:16px;display:flex;flex-direction:column;gap:12px}
.daily h3{margin:0;font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{padding:8px 2px;text-align:center;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;font-weight:800}
.day.cur{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,74,.5);background:rgba(255,210,74,.12)}
.day.done{opacity:.55}
.day b{display:block;font-size:14px;color:var(--gold)}
/* packs */
.pack{--pw:200px;position:relative;width:var(--pw);aspect-ratio:3/5;font-size:calc(var(--pw)/13);filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotate(var(--drag,0deg));transition:transform .18s ease-out,filter .25s;margin:0 auto}
.pack.tilting{transition:none}
.pack-body,.pack-top{position:absolute;inset:0}
.pack-body{clip-path:var(--clip-full)}
.pack-top{clip-path:var(--clip-top);visibility:hidden;transform-origin:15% 100%}
.pack.tear .pack-body{clip-path:var(--clip-torn);transition:none}
.pack.tear .pack-top{visibility:visible;animation:flyTop 1.1s cubic-bezier(.3,.1,.7,.4) forwards}
.pf{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.pf-foil{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 .7em,rgba(255,255,255,.09) .7em 1.4em);mix-blend-mode:overlay}
.pf-glow{position:absolute;left:50%;top:50%;width:90%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.65),transparent 62%)}
.pf-top{position:relative;margin-top:1.7em;font-weight:900;letter-spacing:.16em;font-size:1.08em;text-shadow:0 .1em .4em rgba(0,0,0,.6);color:#fff}
.pf-top b{color:#ffd24a}
.pf-mascot{position:absolute;left:50%;top:50%;width:86%;transform:translate(-50%,-48%);filter:drop-shadow(0 .5em .6em rgba(0,0,0,.5));pointer-events:none}
.pf-mascot.sil{filter:brightness(0) drop-shadow(0 0 .8em rgba(190,140,255,.9));opacity:.85}
.pf-q{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:9em;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 0 .4em #b27bff}
.pf-ribbon{position:absolute;left:0;right:0;bottom:3.3em;text-align:center;padding:.55em .3em;background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 18%,rgba(0,0,0,.65) 82%,transparent);font-weight:900;letter-spacing:.14em;font-size:.98em;color:#fff;text-shadow:0 0 .6em rgba(255,255,255,.5)}
.pf-sub{position:absolute;bottom:1.6em;left:0;right:0;text-align:center;font-size:.66em;letter-spacing:.2em;font-weight:800;color:rgba(255,255,255,.85)}
.pf-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 62%);background-size:260% 100%;animation:sweep 4.2s linear infinite;mix-blend-mode:overlay}
.pf-crimp{position:absolute;left:0;right:0;height:5%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 .12em,rgba(255,255,255,.22) .12em .3em)}
.pf-crimp.t{top:0}.pf-crimp.b{bottom:0}
/* cards */
.card{position:relative;width:var(--cw,200px);aspect-ratio:63/88;font-size:calc(var(--cw,200px)/16);border-radius:.9em;padding:.42em;background:linear-gradient(135deg,var(--rc),var(--rc2),var(--rc));background-size:200% 200%;box-shadow:0 0 0 .07em rgba(0,0,0,.45),0 .5em 1.3em rgba(0,0,0,.5),0 0 1.5em -.1em var(--glow);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;color:#12151f;user-select:none;-webkit-user-select:none;--ho:0;--tx:50%;--ty:50%;--bx:50%;--by:50%;flex:none}
.card.tilting{transition:none}
.card.big{touch-action:none}
.card-face{position:relative;height:100%;border-radius:.62em;overflow:hidden;background:linear-gradient(165deg,var(--pl),var(--pa));display:flex;flex-direction:column;padding:.4em .5em .3em}
.hdr{display:flex;align-items:center;gap:.35em;font-weight:800;padding:.05em .1em .3em}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02em}
.hp{font-size:.95em;font-weight:900;color:#b01c14;white-space:nowrap}.hp small{font-size:.55em;margin-right:.15em}
.tp{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--s);font-size:.78em;box-shadow:inset 0 0 0 .1em rgba(255,255,255,.75);flex:none}
.tp.sm{width:1.3em;height:1.3em}
.art{position:relative;flex:1;min-height:0;border-radius:.4em;border:.2em solid #dcb552;background:radial-gradient(circle at 50% 38%,var(--pl),var(--s));overflow:hidden;box-shadow:inset 0 0 .8em rgba(0,0,0,.35)}
.art::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.12) 0 8deg,transparent 8deg 22deg)}
.art img,.art .fb{position:absolute;left:4%;top:4%;width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 .3em .4em rgba(0,0,0,.4))}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3.6em;text-align:center}
.fb small{font-size:.22em;font-weight:900;color:#fff;text-shadow:0 0 .4em #000;letter-spacing:.08em}
.atk{margin-top:.4em;padding:.3em .45em;background:rgba(255,255,255,.58);border-radius:.4em;min-height:4.3em}
.atk-row{display:flex;align-items:center;gap:.4em;font-size:.95em}.atk-row b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atk-row i{font-style:normal;font-weight:900;font-size:1.2em}
.atk p{margin:.2em 0 0;font-size:.64em;line-height:1.25;font-weight:600}
.ft{display:flex;justify-content:space-between;gap:.4em;font-size:.58em;font-weight:800;padding:.35em .15em 0;opacity:.85;white-space:nowrap}
.holo,.glare,.sparkles{position:absolute;inset:0;pointer-events:none;z-index:5}
.holo{opacity:calc(var(--ho)*.6);mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 18%,rgba(255,40,120,.55) 30%,rgba(255,200,0,.55) 38%,rgba(0,255,150,.55) 46%,rgba(0,170,255,.55) 54%,rgba(150,0,255,.55) 62%,transparent 74%);background-size:300% 300%;background-position:var(--bx) var(--by);animation:holoIdle 5s ease-in-out infinite}
.card.tilting .holo{opacity:var(--ho);animation:none}
.glare{opacity:0;mix-blend-mode:overlay;background:radial-gradient(circle at var(--tx) var(--ty),rgba(255,255,255,.7),transparent 55%)}
.card.tilting .glare{opacity:.9}
.sparkles{mix-blend-mode:screen;background-image:radial-gradient(circle,#fff 0 .09em,transparent .12em),radial-gradient(circle,#fff 0 .07em,transparent .1em),radial-gradient(circle,#ffe9a8 0 .12em,transparent .15em);background-size:3.3em 3.7em,4.6em 4.1em,5.9em 6.3em;background-position:0 0,1.2em 1.9em,2.6em .8em;animation:twinkle 2.3s ease-in-out infinite}
.shiny-tag{position:absolute;right:.5em;bottom:2.3em;z-index:6;font-size:.62em;font-weight:900;padding:.25em .6em;border-radius:999px;background:linear-gradient(90deg,#ffe27a,#ff9ad5,#7ee0ff);color:#1a1030}
.card.shiny .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.7) 0 .15em,transparent .3em),radial-gradient(circle at 78% 62%,rgba(255,255,255,.7) 0 .12em,transparent .25em);animation:twinkle 1.6s infinite}
/* rarities */
.r-common{--rc:#7d8594;--rc2:#cfd4dd;--glow:rgba(160,170,190,.3);--ho:0}
.r-uncommon{--rc:#1f9f58;--rc2:#9af0be;--glow:rgba(60,220,130,.5);--ho:.15}
.r-rare{--rc:#2f7bff;--rc2:#a9d0ff;--glow:rgba(70,150,255,.65);--ho:.4}
.r-double{--rc:#8b4dff;--rc2:#e3c8ff;--glow:rgba(160,100,255,.75);--ho:.6}
.r-ultra{--rc:#d49a00;--rc2:#fff0a6;--glow:rgba(255,205,60,.85);--ho:.7}
.r-ultra .holo{background:linear-gradient(115deg,transparent 20%,rgba(255,215,0,.6) 38%,rgba(255,255,210,.85) 50%,rgba(255,170,0,.6) 62%,transparent 80%);background-size:300% 300%;background-position:var(--bx) var(--by)}
.r-illustration,.r-special,.r-secret{background:linear-gradient(135deg,#ff5fa8,#ffd36e,#6effb1,#6ec9ff,#c76eff,#ff5fa8);background-size:300% 300%;animation:rbBorder 7s linear infinite}
.r-illustration{--rc:#ff5fa8;--rc2:#7ee0ff;--glow:rgba(255,130,200,.8);--ho:.55}
.r-special{--rc:#c88cff;--rc2:#7ee0ff;--glow:rgba(200,140,255,.9);--ho:.7}
.r-secret{--rc:#ff4fd8;--rc2:#4fe3ff;--glow:rgba(255,120,230,.95);--ho:.85;animation-duration:3.5s}
.r-secret .holo{mix-blend-mode:color-dodge;background:conic-gradient(from 0deg at var(--tx) var(--ty),#ff3b6b,#ffd23b,#3bff8a,#3bd2ff,#a03bff,#ff3b6b);animation:none}
.r-hyper{--rc:#b8860b;--rc2:#fff2a8;--glow:rgba(255,215,90,.95);--ho:.8;background:linear-gradient(135deg,#8a5a00,#ffe27a,#b8860b,#fff2a8,#8a5a00);background-size:300% 300%;animation:rbBorder 6s linear infinite}
.r-hyper .holo{background:repeating-linear-gradient(45deg,rgba(255,215,0,.45) 0 .35em,transparent .35em .7em),linear-gradient(115deg,transparent 20%,rgba(255,230,120,.8) 50%,transparent 80%);background-size:auto,300% 300%;background-position:0 0,var(--bx) var(--by)}
.r-hyper .card-face::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,200,40,.25),rgba(255,160,0,.15));mix-blend-mode:color;z-index:4;pointer-events:none}
.card.big.r-ultra,.card.big.r-hyper,.card.big.r-secret,.card.big.r-special{animation-name:rbBorder,glowPulse}
.fullart .card-face{padding:0;background:#111}
.fullart .art{position:absolute;inset:0;border:0;border-radius:0;background:radial-gradient(circle at 50% 35%,var(--pl),var(--s) 75%)}
.fullart .art img,.fullart .art .fb{left:-6%;top:-2%;width:112%;height:104%;object-fit:cover;object-position:center 22%}
.fullart .hdr{position:relative;z-index:3;background:linear-gradient(rgba(0,0,0,.72),transparent);color:#fff;padding:.5em .6em .9em}
.fullart .hp{color:#ffd0ca}
.fullart .atk{position:absolute;left:0;right:0;bottom:1.55em;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.82) 38%);color:#fff;border-radius:0;padding:1.4em .7em .35em;min-height:0}
.fullart .ft{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(0,0,0,.72);color:#fff;padding:.4em .6em}
.card.unknown{--rc:#39406a;--rc2:#59628f;--glow:rgba(0,0,0,0)}
.card.unknown .card-face{background:linear-gradient(165deg,#2b3263,#161b3c);color:#8a93c4}
.card.unknown .art{border-color:#3a4272;background:#0f1330}
.card.unknown .art img{filter:brightness(0) opacity(.55)}
.card.unknown .art::before{display:none}
.sil{filter:brightness(0)}
/* grids */
.grid{--cw:var(--gcw);display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--gcw) + 12px),1fr));gap:16px 10px;justify-items:center}
.cell{position:relative;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto calc(var(--gcw)*1.4)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.cnt{position:absolute;right:-4px;top:-6px;z-index:8;padding:3px 8px;border-radius:999px;background:linear-gradient(135deg,#ffe27a,#ff9d1c);color:#1c1300;font-weight:900;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.shn{position:absolute;left:-2px;top:-6px;z-index:8;font-size:16px}
.new-tag{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:9;padding:3px 10px;border-radius:999px;background:linear-gradient(135deg,#ff5f7e,#ff2a52);color:#fff;font-weight:900;font-size:11px;letter-spacing:.12em;box-shadow:0 0 14px rgba(255,60,100,.8)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{flex:1 1 130px;min-width:0;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px}
.toolbar select option{color:#111}
.toolbar input::placeholder{color:var(--mut)}
.sumline{color:var(--mut);font-size:13px;margin:0 0 14px}
.sumline b{color:var(--ink)}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
/* dex */
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3dc2ff,#8b4dff,#ff5fa8,#ffd24a);transition:width .6s}
.dexhead{padding:16px;margin-bottom:14px}
.dexhead big{display:block;font-size:clamp(20px,5vw,28px);font-weight:900;margin-bottom:10px}
.gens{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gens .chip{font-size:11px;padding:4px 9px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.dex-it{position:relative;padding:10px 6px 8px;border-radius:14px;background:var(--glass);border:1px solid var(--line);text-align:center;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 150px;transition:.2s}
.dex-it:hover{transform:translateY(-3px);background:var(--glass2)}
.dex-it img,.dex-it .fb{width:78px;height:78px;object-fit:contain;display:block;margin:0 auto 4px}
.dex-it .fb{font-size:34px}
.dex-it.unk img{filter:brightness(0) opacity(.45)}
.dex-it small{display:block;color:var(--mut);font-size:11px;font-weight:700}
.dex-it b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-it .ty{font-size:13px;margin-top:2px}
.dex-it.got{border-color:rgba(255,210,74,.5)}
/* store */
.storegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{--rgb:255,255,255;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:50%;top:28%;width:240px;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--rgb),.4),transparent 65%);pointer-events:none}
.pcard .pack{--pw:128px;position:relative;margin:6px auto}
.pcard h3{margin:6px 0 0;font-size:17px;letter-spacing:.04em}
.pcard p{margin:0;color:var(--mut);font-size:13px;min-height:2.6em}
.stars{color:var(--gold);letter-spacing:.1em;font-size:14px}
.price{font-size:20px;font-weight:900;color:var(--gold)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.pbtns .btn{flex:1 1 100px}
.owned{font-size:12px;color:var(--mut)}
/* ach */
.achlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ach{display:flex;gap:12px;padding:14px;align-items:center}
.ach .ic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.ach.done .ic{background:linear-gradient(135deg,#ffe27a,#ff9d1c);box-shadow:0 0 18px rgba(255,200,60,.5)}
.ach:not(.done) .ic{filter:grayscale(1);opacity:.6}
.ach .tx{flex:1;min-width:0}.ach b{display:block}.ach p{margin:2px 0 8px;color:var(--mut);font-size:13px}
.ach .rw{font-size:12px;font-weight:900;color:var(--gold);white-space:nowrap}
.badge{font-size:11px;font-weight:900;letter-spacing:.08em}
/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:14px;text-align:center}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.sec{padding:16px;margin-bottom:14px}.sec h3{margin:0 0 12px;font-size:16px}
.rbar{display:grid;grid-template-columns:116px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.rbar .bar{height:10px}.rbar i{background:var(--c)!important}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.th{width:50px;height:50px;border-radius:12px;border:2px solid var(--c,#888);background:rgba(255,255,255,.08);overflow:hidden;position:relative;cursor:pointer;flex:none}
.th img,.th .fb{width:100%;height:100%;object-fit:contain;display:block;font-size:22px}
.th.s::after{content:"✨";position:absolute;right:0;bottom:0;font-size:12px}
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.hrow .meta{min-width:130px;font-size:12px;color:var(--mut)}.hrow .meta b{display:block;color:var(--ink);font-size:13px}
.bestwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;--cw:190px}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:0}.srow small{display:block;color:var(--mut);font-size:12px}
.sw{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,#5ad0ff,#3a6bff)}.sw.on::after{left:25px}
.srow input[type=range]{width:150px;accent-color:#ffc928}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.themes .btn.on{outline:2px solid var(--gold)}
.bgrp{display:flex;gap:8px;flex-wrap:wrap}
.guide{font-size:13px;color:var(--mut);line-height:1.6}
.guide code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-back{position:absolute;inset:0;background:rgba(3,5,18,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-box{position:relative;max-height:calc(var(--vh,1vh)*94);overflow:auto;width:min(760px,100%);padding:22px 18px;border-radius:22px;background:linear-gradient(160deg,rgba(40,34,92,.97),rgba(14,16,46,.98));border:1px solid var(--line);box-shadow:0 20px 70px rgba(0,0,0,.65);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
.modal-x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--glass2);z-index:3}
.detail{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center}
.d-card{--cw:min(76vw,300px,calc(var(--vh,1vh)*46));cursor:zoom-in}
.modal.zoom .d-card{--cw:min(92vw,calc(var(--vh,1vh)*62));cursor:zoom-out}
.modal.zoom .d-info{display:none}
.d-info{flex:1 1 240px;min-width:220px}
.d-info h2{margin:0 0 4px;font-size:26px}
.rp{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.08em;color:#14101e;background:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}.kv span{color:var(--mut)}
.confirm{text-align:center}.confirm h3{margin:0 0 8px}.confirm p{color:var(--mut);margin:0 0 18px}.confirm .bgrp{justify-content:center}
#toasts{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:min(92vw,440px);padding:11px 18px;border-radius:14px;font-weight:800;font-size:14px;background:rgba(20,22,56,.96);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .35s cubic-bezier(.2,1.2,.4,1)}
.toast.ok{border-color:#38d98a}.toast.err{border-color:#ff5a6e}.toast.ach{border-color:var(--gold);background:linear-gradient(135deg,rgba(70,50,10,.97),rgba(30,20,60,.97))}
.toast.out{animation:toastOut .3s forwards}
/* opening */
.opening{position:fixed;inset:0;z-index:50;overflow:hidden;opacity:0;transition:opacity .4s;--rgb:255,210,90;touch-action:manipulation}
.opening.on{opacity:1}
.op-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(var(--rgb),.22),rgba(2,3,12,.93) 62%)}
.op-top{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:6;display:flex;gap:8px}
.op-btn{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid var(--line);font-weight:900;font-size:12px;letter-spacing:.08em}
.op-stage{position:absolute;inset:0;--cw:min(76vw,340px,calc(var(--vh,1vh)*41))}
.rays{position:absolute;left:50%;top:46%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(var(--rgb),.34) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 52%);mask-image:radial-gradient(circle,#000,transparent 52%);opacity:0;transition:opacity .5s;animation:spin 16s linear infinite;pointer-events:none}
.opening.rays-on .rays{opacity:1}
.beam{position:absolute;left:50%;top:46%;width:80vmin;height:80vmin;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(var(--rgb),.55) 35%,transparent 68%);opacity:0;pointer-events:none}
.beam.on{animation:beam 1.3s ease-out forwards}
.op-pack-wrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);--pw:min(60vw,290px,calc(var(--vh,1vh)*37));touch-action:none;cursor:grab}
.op-pack-wrap .float{animation:floaty 3s ease-in-out infinite}
.op-pack-wrap .pack{transition:transform .1s}
.op-pack-wrap.tearing .float{animation:packShake .5s}
.op-pack-wrap.drop .float{animation:packDrop 1s ease-in forwards}
.op-pack-wrap .pack::after{content:"";position:absolute;left:-4%;right:-4%;top:16%;height:0;border-top:.18em dashed rgba(255,255,255,.75);animation:pulse 1.2s infinite}
.op-pack-wrap.tearing .pack::after,.op-pack-wrap.drop .pack::after{display:none}
.op-hint{position:absolute;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom));text-align:center;font-weight:900;letter-spacing:.26em;font-size:15px;animation:pulse 1.4s ease-in-out infinite;text-shadow:0 0 14px rgba(var(--rgb),.9);pointer-events:none}
.op-hint.off{opacity:0;animation:none}
.card-stack{position:absolute;left:50%;top:46%;width:var(--cw);aspect-ratio:63/88;transform:translate(-50%,-50%)}
.card-stack.rise{animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
.rc{position:absolute;inset:0;perspective:1400px;--o:0;transform:translate(calc(var(--o)*5px),calc(var(--o)*-4px)) rotate(calc(var(--o)*1.4deg));transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .45s;cursor:pointer}
.rc-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .95s cubic-bezier(.3,1.15,.4,1)}
.rc.flipped .rc-inner{transform:rotateY(180deg)}
.rc-back,.rc-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rc-front{transform:rotateY(180deg)}
.rc-back{border-radius:5.4% / 3.9%;background:radial-gradient(circle at 50% 50%,#ffffff 0 7%,#d8343f 7% 9%,transparent 9%),conic-gradient(from 0deg,#14267a,#2d57e0,#14267a,#3a2a9a,#14267a);border:.5em solid #e9c46a;box-shadow:0 .5em 1.6em rgba(0,0,0,.6);display:grid;place-items:center;font-size:calc(var(--cw)/16);overflow:hidden}
.rc-back::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,60,80,.9) 0 46%,#0b0b18 46% 54%,rgba(255,255,255,.95) 54%);clip-path:circle(24% at 50% 50%)}
.rc-back::after{content:"";position:absolute;left:50%;top:50%;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:.45em solid #0b0b18}
.rc.charge .rc-back{animation:charge .22s infinite;box-shadow:0 0 3em 1em rgba(var(--rgb),.9)}
.rc.gone{transform:translate(-130%,-34%) rotate(-28deg) scale(.45);opacity:0;pointer-events:none;transition:transform .55s cubic-bezier(.5,0,.8,.4),opacity .5s}
.op-tray{position:absolute;left:0;right:0;bottom:calc(4% + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:7px;padding:0 10px;min-height:44px}
.tr{width:42px;height:42px;border-radius:11px;border:2px solid var(--c);background:rgba(255,255,255,.1);overflow:hidden;animation:pop .35s;box-shadow:0 0 12px var(--c)}
.tr img,.tr .fb{width:100%;height:100%;object-fit:contain;display:block;font-size:20px}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.95),rgba(var(--rgb),.55) 45%,transparent 75%);opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flashA .8s ease-out}
.legend-banner{position:absolute;left:0;right:0;top:calc(9% + env(safe-area-inset-top));text-align:center;font-size:clamp(22px,7vw,44px);font-weight:900;letter-spacing:.14em;background:linear-gradient(90deg,#fff3b0,#ffc928,#ff8a3d,#ffc928,#fff3b0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,60,.9));opacity:0;pointer-events:none;z-index:5}
.legend-banner.go{animation:banner 2.4s ease-out}
.op-summary{position:absolute;inset:0;z-index:7;overflow:auto;padding:calc(56px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;animation:pageIn .5s both}
.op-summary h2{margin:0;font-size:clamp(22px,6vw,32px);letter-spacing:.1em}
.sum-grid{--cw:clamp(104px,29vw,168px);display:flex;flex-wrap:wrap;gap:20px 14px;justify-content:center;max-width:900px}
.sum-info{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.shake{animation:shake .5s}.shake-big{animation:shake .95s}
/* keyframes */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sweep{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}
@keyframes holoIdle{0%,100%{background-position:15% 20%}50%{background-position:85% 80%}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rbBorder{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes glowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) saturate(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flyTop{0%{transform:none;opacity:1}30%{transform:translate(4%,-12%) rotate(8deg)}100%{transform:translate(70%,-170%) rotate(65deg);opacity:0}}
@keyframes packShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes packDrop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(60vh) scale(.8);opacity:0}}
@keyframes beam{0%{transform:translate(-50%,-50%) scale(0);opacity:1}60%{opacity:.9}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
@keyframes rise{0%{transform:translate(-50%,-30%) scale(.55);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes charge{0%,100%{transform:translate(0,0) scale(1.03)}25%{transform:translate(-3px,2px) scale(1.05)}75%{transform:translate(3px,-2px) scale(1.05)}}
@keyframes flashA{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes banner{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-9px,5px)}20%{transform:translate(8px,-6px)}30%{transform:translate(-7px,-4px)}40%{transform:translate(7px,6px)}50%{transform:translate(-5px,3px)}60%{transform:translate(5px,-3px)}80%{transform:translate(-2px,2px)}}
.reduce *,.reduce *::before,.reduce *::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
.reduce .rays{display:none}
@media(max-width:759px){
 #nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(8,10,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);flex-wrap:nowrap;gap:2px}
 #nav button{flex:1;flex-direction:column;gap:2px;padding:6px 0;border-radius:10px;font-size:9.5px;letter-spacing:0;border:0;background:none}
 #nav button .ni{font-size:19px}
 .nl{display:none}.ns{display:block}
 #view{padding-bottom:96px}
 .logo small{display:none}
 .chip{padding:5px 9px;font-size:12px}
 #topbar{gap:7px;padding:8px 10px}
 .rbar{grid-template-columns:96px 1fr 44px}
}
@media(min-width:760px){.grid{--gcw:176px}}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 78%)}

.btn{box-shadow:0 5px 16px rgba(0,0,0,.12)}
.btn.pri{box-shadow:0 8px 24px rgba(255,190,40,.25)}

/* ===================== PREMIUM UI PASS · MOBILE COLLECTION ===================== */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--font-ui:'Outfit', 'Segoe UI', sans-serif;--font-display:'Space Grotesk','Outfit',sans-serif;--gcw:clamp(140px,42vw,176px)}
html,body,button,input,select,textarea{font-family:var(--font-ui)}
h1,h2,h3,.logo b,.hero-name,.nm,.btn,.chip{font-family:var(--font-display)}
html{font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{letter-spacing:.005em;background-image:radial-gradient(ellipse at 50% -12%,rgba(112,73,255,.22),transparent 48%),radial-gradient(ellipse at 5% 52%,rgba(38,111,255,.10),transparent 35%),radial-gradient(ellipse at 95% 72%,rgba(177,64,255,.08),transparent 32%),radial-gradient(1200px 760px at 50% -8%,var(--bg2),var(--bg1) 70%)}
#topbar{min-height:62px;padding-left:15px;padding-right:15px;border-bottom:1px solid rgba(167,174,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.logo b{font-size:clamp(14px,4vw,17px);letter-spacing:.09em;font-weight:900}
.logo .ball{width:38px;height:38px}
#view{padding-top:13px}
h1.pt{font-size:clamp(25px,6vw,34px);font-weight:900;letter-spacing:.025em;line-height:1.12;margin:10px 0 8px;text-shadow:0 5px 24px rgba(123,107,255,.2)}
.sumline,.sub{line-height:1.55}
.sumline{font-size:13px;letter-spacing:.015em}
.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0 16px}
.toolbar input,.toolbar select{width:100%;min-width:0;min-height:48px;padding:0 14px;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));border:1px solid rgba(184,190,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 7px 18px rgba(0,0,0,.12);font-size:14px;font-weight:600;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:rgba(255,211,92,.65);box-shadow:0 0 0 3px rgba(255,205,75,.12)}
.toolbar input{grid-column:span 1}
.toolbar select:last-child{grid-column:1/-1}
.toolbar select option{background:#171936;color:#f4f4ff}
.grid{--gcw:clamp(140px,calc((100vw - 66px)/2),176px);grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px;align-items:start}
.cell{width:100%;display:flex;justify-content:center;min-width:0;padding:3px 0 5px}
.cell .card{width:min(100%,var(--gcw));font-size:calc(min(100vw,420px)/31);border-radius:13px;padding:5px;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 10px 25px rgba(0,0,0,.42),0 0 22px -8px var(--glow)}
.card-face{border-radius:9px}
.card .hdr{gap:.28em;padding:.05em .08em .26em}
.card .nm{font-weight:900;letter-spacing:-.025em}
.card .art{border-radius:6px}
.card .atk{border-radius:6px}
.cnt{right:2px;top:-5px;border:2px solid #17152f;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.new-tag{top:-8px;font-size:9px;padding:3px 8px}
.shn{left:2px;top:-5px}
#nav{background:rgba(7,9,27,.94);border-top:1px solid rgba(184,190,255,.18);box-shadow:0 -12px 34px rgba(0,0,0,.3);padding-top:8px}
#nav button{min-height:52px;font-family:var(--font-display);font-weight:700;color:#aeb5d7}
#nav button .ni{font-size:21px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
#nav button.on{background:linear-gradient(180deg,rgba(255,218,104,.22),rgba(255,181,35,.08));color:#ffe18a;box-shadow:inset 0 0 0 1px rgba(255,211,91,.28),0 0 18px rgba(255,190,60,.1)}
.glass{border-color:rgba(184,190,255,.17)}
@media(max-width:370px){
 .grid{--gcw:calc((100vw - 58px)/2);gap:14px 8px}
 .toolbar{gap:7px}
 .toolbar input,.toolbar select{font-size:12px;padding:0 10px}
 #nav button{font-size:8.5px}
}
@media(min-width:760px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:20px 16px}
 .cell{width:100%}
 .toolbar{display:flex}
 .toolbar select:last-child{grid-column:auto}
}

function weightedPick(items,wf){
  let t=0;const w=items.map(i=>{const x=Math.max(0,wf(i)||0);t+=x;return x});
  if(t<=0)return items[Math.floor(Math.random()*items.length)];
  let r=Math.random()*t;
  for(let i=0;i<items.length;i++){r-=w[i];if(r<=0&&w[i]>0)return items[i]}

}

function defaultState(){
  return{v:1,coins:CONFIG.startCoins,inv:Object.assign({},CONFIG.startPacks),cards:{},shiny:{},first:{},packsOpened:0,ach:{},history:[],
    stats:{spent:0,earned:0,sold:0,pulls:{},best:null,perPack:{}},daily:{last:'',streak:0},
    settings:{muted:false,volume:.7,theme:'midnight',particles:true,reduce:!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)},
    created:Date.now(),saved:0};

function sanitize(raw){
  if(!raw||typeof raw!=='object')return defaultState();
  const d=defaultState();
  const num=(v,def)=>Number.isFinite(+v)&&+v>=0?Math.floor(+v):def;
  d.coins=num(raw.coins,d.coins);d.packsOpened=num(raw.packsOpened,0);
  d.inv={};if(raw.inv&&typeof raw.inv==='object')PACKS.forEach(p=>{const n=num(raw.inv[p.id],0);if(n)d.inv[p.id]=n});
  d.cards={};d.shiny={};d.first={};
  if(raw.cards&&typeof raw.cards==='object')for(const k in raw.cards){const id=+k,n=num(raw.cards[k],0);if(BYID.has(id)&&n>0)d.cards[id]=n}
  if(raw.shiny&&typeof raw.shiny==='object')for(const k in raw.shiny){const id=+k,n=num(raw.shiny[k],0);if(BYID.has(id)&&n>0)d.shiny[id]=n}
  if(raw.first&&typeof raw.first==='object')for(const k in raw.first){const id=+k;if(BYID.has(id))d.first[id]=num(raw.first[k],Date.now())}
  d.ach={};if(raw.ach&&typeof raw.ach==='object')ACH.forEach(a=>{if(raw.ach[a.id])d.ach[a.id]=num(raw.ach[a.id],Date.now())});
  d.history=[];
  if(Array.isArray(raw.history))raw.history.slice(0,40).forEach(h=>{
    if(h&&PACK_BY[h.pack]&&Array.isArray(h.cards)){
      const cs=h.cards.filter(c=>Array.isArray(c)&&BYID.has(+c[0])).map(c=>[+c[0],c[1]?1:0]);
      if(cs.length)d.history.push({t:num(h.t,Date.now()),pack:h.pack,cards:cs});
    }
  });
  const st=raw.stats||{};
  d.stats.spent=num(st.spent,0);d.stats.earned=num(st.earned,0);d.stats.sold=num(st.sold,0);
  d.stats.pulls={};RARITIES.forEach(r=>{const n=num((st.pulls||{})[r.k],0);if(n)d.stats.pulls[r.k]=n});
  d.stats.perPack={};PACKS.forEach(p=>{const n=num((st.perPack||{})[p.id],0);if(n)d.stats.perPack[p.id]=n});
  d.stats.best=null;
  if(st.best&&BYID.has(+st.best.id))d.stats.best={id:+st.best.id,shiny:!!st.best.shiny,ri:RIDX[BYID.get(+st.best.id).rarity]};
  const dl=raw.daily||{};d.daily={last:/^\d{4}-\d{2}-\d{2}$/.test(dl.last||'')?dl.last:'',streak:num(dl.streak,0)};
  const se=raw.settings||{};
  d.settings.muted=!!se.muted;d.settings.volume=clamp(Number.isFinite(+se.volume)?+se.volume:.7,0,1);
  d.settings.theme=['midnight','inferno','ocean','aurora'].includes(se.theme)?se.theme:'midnight';
  d.settings.particles=se.particles!==false;d.settings.reduce=!!se.reduce;
  d.created=num(raw.created,Date.now());
  return d;
}

const Snd={
  ctx:null,master:null,
  init(){
    if(!this.ctx){
      try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination)}catch(e){this.ctx=null;return}
    }
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
    this.vol();
  },
  vol(){if(this.master&&S)this.master.gain.value=S.settings.muted?0:S.settings.volume},
  tone(f,d=.15,type='sine',v=.2,slide=0,delay=0){
    if(!this.ctx||S.settings.muted)return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.05);
  },
  noise(d=.3,v=.2,f0=800,f1=4000,delay=0){
    if(!this.ctx||S.settings.muted)return;
    const c=this.ctx,t=c.currentTime+delay,len=Math.max(1,Math.floor(c.sampleRate*d)),buf=c.createBuffer(1,len,c.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=.9;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(50,f1),t+d);
    const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);
  },
  play(n,a=0){
    if(!this.ctx)return;
    switch(n){
      case'click':this.tone(740,.07,'triangle',.12,-200);break;
      case'tear':this.noise(.55,.4,500,6500);this.tone(130,.35,'sawtooth',.16,-70);break;
      case'flip':this.noise(.2,.18,1200,3600);this.tone(380,.2,'triangle',.1,320);break;
      case'charge':this.tone(180,1,'sawtooth',.07,420);this.tone(240,1,'triangle',.06,500);break;
      case'rare':{const N=[523,659,784,1047,1319,1568,2093];for(let i=0;i<Math.min(7,a+2);i++){this.tone(N[i],.35,'triangle',.14,0,i*.09);this.tone(N[i]*2,.25,'sine',.04,0,i*.09)}break}
      case'legend':[392,494,587,784].forEach((f,i)=>this.tone(f,1.3,'sawtooth',.06,0,i*.04));this.noise(1.2,.12,300,6000);[784,988,1175,1568,1976].forEach((f,i)=>this.tone(f,.5,'triangle',.12,0,.4+i*.1));break;
      case'ach':[784,988,1175,1568].forEach((f,i)=>this.tone(f,.45,'sine',.16,0,i*.11));break;
      case'coin':this.tone(988,.08,'square',.07);this.tone(1319,.2,'square',.07,0,.08);break;
      case'error':this.tone(170,.28,'sawtooth',.14,-70);break;
    }
  }
};

const THEME_RGB={midnight:'120,190,255',inferno:'255,150,90',ocean:'90,220,255',aurora:'120,255,190'};
const FX={
  bg:null,fx:null,b:null,f:null,W:0,H:0,dpr:1,stars:[],P:[],running:false,last:0,
  init(){
    this.bg=$('#bg');this.fx=$('#fx');this.b=this.bg.getContext('2d');this.f=this.fx.getContext('2d');
    this.resize();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>this.resize(),120)});
    this.ensure();
  },
  resize(){
    this.dpr=Math.min(devicePixelRatio||1,2);this.W=innerWidth;this.H=innerHeight;
    [this.bg,this.fx].forEach(c=>{c.width=Math.round(this.W*this.dpr);c.height=Math.round(this.H*this.dpr)});
    this.b.setTransform(this.dpr,0,0,this.dpr,0,0);this.f.setTransform(this.dpr,0,0,this.dpr,0,0);
    document.documentElement.style.setProperty('--vh',(innerHeight*.01)+'px');
    this.makeStars();
  },
  makeStars(){
    const n=S&&S.settings.particles?Math.round(clamp(this.W*this.H/15000,36,100)):0;
    this.stars=Array.from({length:n},()=>({x:Math.random()*this.W,y:Math.random()*this.H,r:rand(.4,1.7),tw:rand(0,6.28),sp:rand(.6,2.2),vy:rand(-8,-2),orb:Math.random()<.16,or:rand(30,90)}));
  },
  setParticles(){this.makeStars();if(!S.settings.particles)this.b.clearRect(0,0,this.W,this.H);this.ensure()},
  ensure(){if(!this.running&&(S.settings.particles||this.P.length)){this.running=true;this.last=performance.now();requestAnimationFrame(t=>this.loop(t))}},
  burst(x,y,o={}){
    const k=S.settings.reduce?.5:1,n=Math.round((o.n||60)*k),cols=o.colors||['#fff','#ffd24a'];
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283,sp=rand(o.min||120,o.max||620);
      this.P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(0,120),g:o.g==null?420:o.g,drag:1.4,life:rand(.7,1.6),max:1.6,size:rand(1.5,4.2),color:cols[i%cols.length],shape:'c',rot:0,vr:0});
    }
    this.cap();this.ensure();
  },
  confetti(){
    const cols=['#ff4f8b','#ffd24a','#4fe3ff','#7dff9a','#b27bff','#ff8a3d'],k=S.settings.reduce?.4:1;
    for(let w=0;w<3;w++)setTimeout(()=>{
      const n=Math.round(60*k);
      for(let i=0;i<n;i++)this.P.push({x:rand(0,this.W),y:rand(-40,-5),vx:rand(-80,80),vy:rand(80,320),g:260,drag:.5,life:rand(2.4,3.8),max:3.8,size:rand(4,8),color:cols[i%cols.length],shape:'r',rot:rand(0,6),vr:rand(-8,8)});
      this.cap();this.ensure();
    },w*350);
  },
  cap(){if(this.P.length>700)this.P.splice(0,this.P.length-700)},
  clear(){this.P.length=0;this.f.clearRect(0,0,this.W,this.H)},
  loop(ts){
    const dt=Math.min(.05,((ts-this.last)/1000)||.016);this.last=ts;
    const b=this.b,f=this.f,rgb=THEME_RGB[S.settings.theme]||THEME_RGB.midnight;
    if(S.settings.particles){
      b.clearRect(0,0,this.W,this.H);
      for(const s of this.stars){
        s.tw+=dt*s.sp;s.y+=s.vy*dt*(s.orb?1.6:.4);if(s.y<-100){s.y=this.H+100;s.x=Math.random()*this.W}
        const a=.35+.65*Math.abs(Math.sin(s.tw));
        if(s.orb){const g=b.createRadialGradient(s.x,s.y,0,s.x,s.y,s.or);g.addColorStop(0,`rgba(${rgb},${.16*a})`);g.addColorStop(1,`rgba(${rgb},0)`);b.fillStyle=g;b.beginPath();b.arc(s.x,s.y,s.or,0,6.283);b.fill()}
        else{b.fillStyle=`rgba(255,255,255,${a*.85})`;b.beginPath();b.arc(s.x,s.y,s.r,0,6.283);b.fill()}
      }
    }
    f.clearRect(0,0,this.W,this.H);
    for(let i=this.P.length-1;i>=0;i--){
      const p=this.P[i];p.life-=dt;if(p.life<=0){this.P.splice(i,1);continue}
      p.vx*=1-p.drag*dt;p.vy=p.vy*(1-p.drag*dt)+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      f.globalAlpha=clamp(p.life/p.max*1.6,0,1);f.fillStyle=p.color;
      if(p.shape==='r'){f.globalCompositeOperation='source-over';f.save();f.translate(p.x,p.y);f.rotate(p.rot);f.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);f.restore()}
      else{f.globalCompositeOperation='lighter';f.beginPath();f.arc(p.x,p.y,p.size,0,6.283);f.fill()}
    }
    f.globalAlpha=1;f.globalCompositeOperation='source-over';
    if(!S.settings.particles&&!this.P.length){this.running=false;b.clearRect(0,0,this.W,this.H);return}
    requestAnimationFrame(t=>this.loop(t));
  }
};

/* ============================ GAME LOGIC ============================ */
const totalCards=()=>Object.values(S.cards).reduce((a,b)=>a+b,0);
const uniqueOwned=()=>Object.keys(S.cards).length;
const ownedMin=ri=>Object.keys(S.cards).some(i=>RIDX[BYID.get(+i).rarity]>=ri);
const dupCount=()=>Object.values(S.cards).reduce((a,b)=>a+Math.max(0,b-1),0);

function rollRarity(weights,mult,minIdx){
  const ks=RARITIES.filter(r=>RIDX[r.k]>=minIdx);
  return weightedPick(ks,r=>(weights[r.k]||0)*(RIDX[r.k]>=2?mult:1)).k;
}
function rollCard(rk,pack){
  const pool=BYRAR[rk];
  return weightedPick(pool,c=>{let w=1;if(pack.bias&&pack.bias.type===c.type)w*=pack.bias.w;if(pack.legBias&&c.leg)w*=pack.legBias;return w});
}
function rollPack(pack){
  const mult=pack.random?rand(.35,3.4):pack.mult,out=[];
  for(let s=0;s<CONFIG.cardsPerPack;s++){
    const minIdx=pack.guarantee&&pack.guarantee.slot===s?pack.guarantee.min:0;
    const rk=rollRarity(CONFIG.slots[s],s>=3?mult:1,minIdx);
    out.push({id:rollCard(rk,pack).id,shiny:Math.random()<CONFIG.shinyChance});
  }
  return out;
}
function checkAchievements(){
  const gained=[];
  for(let loop=0;loop<4;loop++){
    let any=false;
    ACH.forEach(a=>{
      if(!S.ach[a.id]&&a.cur()>=a.max){S.ach[a.id]=Date.now();S.coins+=a.reward;S.stats.earned+=a.reward;gained.push(a);any=true}
    });
    if(!any)break;
  }
  PENDING.push(...gained);
  return gained;
}
function flushAch(){
  const list=PENDING.splice(0);
  list.forEach((a,i)=>setTimeout(()=>{
    toast(`🏆 ${a.name} terbuka! +🪙${a.reward}`,'ach',3600);Snd.play('ach');
    FX.burst(innerWidth/2,90,{n:40,colors:['#ffd24a','#fff0a0','#fff'],g:300,max:420});
    renderHeader();bumpCoins();
  },i*900));
}
function commit(pack){
  const pulls=rollPack(pack);let bonus=0;
  pulls.forEach(p=>{
    const c=BYID.get(p.id),had=S.cards[p.id]||0,ri=RIDX[c.rarity];
    p.isNew=!had;S.cards[p.id]=had+1;if(!S.first[p.id])S.first[p.id]=Date.now();
    if(p.shiny)S.shiny[p.id]=(S.shiny[p.id]||0)+1;
    p.bonus=RARITIES[ri].bonus+(p.shiny?CONFIG.shinyBonus:0);bonus+=p.bonus;
    S.stats.pulls[c.rarity]=(S.stats.pulls[c.rarity]||0)+1;
    const b=S.stats.best;if(!b||ri>b.ri||(ri===b.ri&&p.shiny&&!b.shiny))S.stats.best={id:p.id,shiny:!!p.shiny,ri};
    preload(c,p.shiny);
  });
  S.coins+=bonus;S.stats.earned+=bonus;S.packsOpened++;
  S.stats.perPack[pack.id]=(S.stats.perPack[pack.id]||0)+1;
  S.history.unshift({t:Date.now(),pack:pack.id,cards:pulls.map(p=>[p.id,p.shiny?1:0])});
  if(S.history.length>40)S.history.length=40;
  checkAchievements();save();
  return{pulls,bonus};
}
function startOpen(packId){
  if(OP.active)return;
  const pack=PACK_BY[packId];if(!pack)return;
  if((S.inv[packId]||0)>0){S.inv[packId]--;if(!S.inv[packId])delete S.inv[packId]}
  else if(S.coins>=pack.price){S.coins-=pack.price;S.stats.spent+=pack.price}
  else{toast(`Koin tidak cukup! Butuh 🪙${pack.price}, kamu punya 🪙${fmt(S.coins)}.`,'err');Snd.play('error');return}
  const res=commit(pack);
  Opening.begin(pack,res);
}
function buyPack(id,thenOpen){
  const p=PACK_BY[id];
  if(S.coins<p.price){toast(`Transaksi gagal: koin kurang 🪙${p.price-S.coins}.`,'err');Snd.play('error');return}
  S.coins-=p.price;S.stats.spent+=p.price;S.inv[id]=(S.inv[id]||0)+1;save();
  Snd.play('coin');renderHeader();bumpCoins();
  if(thenOpen){startOpen(id);return}
  toast(`Berhasil membeli ${p.name}! 🎉`,'ok');renderPage();
}
function claimDaily(){
  const t=todayKey();
  if(S.daily.last===t){toast('Hadiah harian hari ini sudah diklaim. Kembali besok!','err');return}
  S.daily.streak=S.daily.last===todayKey(-1)?S.daily.streak+1:1;S.daily.last=t;
  const day=((S.daily.streak-1)%7)+1,coins=CONFIG.dailyBase+CONFIG.dailyStep*(day-1);
  S.coins+=coins;S.stats.earned+=coins;
  let msg=`Hadiah harian hari ke-${day}: +🪙${coins}`;
  if(day===7){S.inv.mystery=(S.inv.mystery||0)+1;msg+=' + 1 Mystery Pack!'}
  checkAchievements();save();Snd.play('coin');
  FX.confetti();toast(msg,'ok',3600);renderHeader();bumpCoins();renderPage();flushAch();
}
function sellCard(id){
  const n=S.cards[id]||0;if(n<2){toast('Tidak ada kartu duplikat untuk dijual.','err');return}
  const v=RARITIES[RIDX[BYID.get(id).rarity]].sell;
  S.cards[id]--;S.coins+=v;S.stats.earned+=v;S.stats.sold+=v;checkAchievements();save();
  Snd.play('coin');toast(`Duplikat terjual +🪙${v}`,'ok');renderHeader();bumpCoins();openDetail(id);renderPage();flushAch();
}

function crimp(n,amp){
  const top=[],bot=[];
  for(let i=0;i<=n;i++){const x=(i/n*100).toFixed(2);top.push(`${x}% ${i%2?amp:0}%`);bot.push(`${x}% ${i%2?100-amp:100}%`)}
  return{top,bot};
}
const CR=crimp(24,1.2);
const FULL_CLIP='polygon('+CR.top.concat(CR.bot.slice().reverse()).join(',')+')';
function makeTear(){
  const n=24,jag=[];
  for(let i=0;i<=n;i++)jag.push((16+(i%2?1.6:-.4)+Math.random()*1.4).toFixed(2));
  const line=jag.map((y,i)=>`${(i/n*100).toFixed(2)}% ${y}%`);
  return{body:'polygon('+line.concat(CR.bot.slice().reverse()).join(',')+')',top:'polygon('+CR.top.concat(line.slice().reverse()).join(',')+')'};
}

<div class="bgrp"><button class="btn blue" data-act="save">💾 SAVE GAME</button><button class="btn" data-act="export">⬇ Export JSON</button><button class="btn" data-act="copy">📋 Salin JSON</button><button class="btn" data-act="import">⬆ Import JSON</button><button class="btn danger" data-act="reset">🗑 RESET GAME</button></div></div>
<div class="glass sec"><h3>Tentang</h3><p class="guide">Pokémon TCG — Ultimate Pack Opening Simulator adalah proyek penggemar (bukan produk resmi). Artwork dimuat dari repositori publik <code>PokeAPI/sprites</code>. Pokémon &amp; nama karakter adalah merek dagang pemiliknya.<br>Kartu: ${DB.length} · Pack: ${PACKS.length} · Rarity: ${RARITIES.length}.</p></div>`;
};
function renderNav(){
  $('#nav').innerHTML=PAGES.map(p=>`<button data-go="${p.id}" class="${UI.page===p.id?'on':''}" aria-label="${p.label}"><span class="ni">${p.icon}</span><span class="nl">${p.label}</span><span class="ns">${p.short}</span></button>`).join('');
}
function renderPage(){
  const v=$('#view'),sy=scrollY;
  v.innerHTML=RENDER[UI.page]();
  if(POST[UI.page])POST[UI.page]();
  renderHeader();renderNav();
  if(UI.lastPage!==UI.page){v.classList.remove('page-in');void v.offsetWidth;v.classList.add('page-in');scrollTo(0,0);UI.lastPage=UI.page}else scrollTo(0,sy);
}
function go(page){
  if(!RENDER[page])page='home';
  if(location.hash==='#/'+page){UI.page=page;renderPage()}else location.hash='#/'+page;
}
function route(){
  const p=location.hash.replace('#/','')||'home';
  UI.page=RENDER[p]?p:'home';renderPage();
}

/* ============================ DETAIL MODAL ============================ */
function openDetail(id){
  const c=BYID.get(id);if(!c)return;
  const n=S.cards[id]||0,R=RARITIES[RIDX[c.rarity]],sh=S.shiny[id]||0;
  const info=n?`<div class="d-info"><h2>${esc(c.name)}</h2><span class="rp" style="--c:${R.c2}">${R.sym} ${R.label}</span>
<div class="kv"><span>Nomor</span><b>${c.no}/${DB.length} · Dex #${String(c.id).padStart(4,'0')}</b><span>Set</span><b>${esc(c.set)}</b><span>Tipe</span><b>${TYPES[c.type].i} ${c.type}</b><span>HP</span><b>${c.hp}</b><span>Serangan</span><b>${esc(c.atk.n)} — ${c.atk.d}</b><span>Efek</span><b style="font-weight:600">${esc(c.atk.t)}</b><span>Dimiliki</span><b>×${n}${n>1?` (${n-1} duplikat)`:''}</b>${sh?`<span>Shiny</span><b>✨ ×${sh}</b>`:''}<span>Pertama didapat</span><b>${S.first[id]?new Date(S.first[id]).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'—'}</b></div>
<div class="bgrp"><button class="btn sm" data-act="zoom">🔍 Zoom</button>${n>1?`<button class="btn sm pri" data-act="sell" data-id="${id}">Jual 1 duplikat +🪙${R.sell}</button>`:''}</div></div>`
  :`<div class="d-info"><h2>???</h2><p class="sub">Kartu ini belum pernah kamu dapatkan. Buka lebih banyak pack untuk menemukannya!</p><span class="rp" style="--c:#59628f;color:#fff">Rarity tersembunyi</span></div>`;
  openModal(`<div class="detail"><div class="d-card" data-act="zoom">${cardHTML(c,{unknown:!n,eager:true,cls:'tilt big'})}</div>${info}</div>`);
}

/* ============================ OPENING SEQUENCE ============================ */
const OP={active:false,phase:'',pack:null,res:null,idx:0,timers:[],busy:false,root:null};
const Opening={
  later(fn,ms){const t=setTimeout(()=>{OP.timers=OP.timers.filter(x=>x!==t);fn()},ms);OP.timers.push(t);return t},
  clearTimers(){OP.timers.forEach(clearTimeout);OP.timers=[]},
  begin(pack,res){
    OP.active=true;OP.pack=pack;OP.res=res;OP.idx=0;OP.phase='pack';OP.busy=false;
    const root=$('#opening');OP.root=root;root.style.setProperty('--rgb',pack.rgb);
    root.className='opening';root.hidden=false;document.body.classList.add('noscroll');
    const n=res.pulls.length;
    root.innerHTML=`<div class="op-bg"></div>
<div class="op-top"><button class="op-btn" data-act="op-skip">SKIP ⏭</button><button class="op-btn" data-act="op-fs" id="opFs" ${document.fullscreenEnabled?'':'hidden'}>⛶</button></div>
<div class="op-stage" id="opStage"><div class="rays"></div><div class="beam" id="opBeam"></div>
<div class="op-pack-wrap" id="opPackWrap"><div class="float">${packHTML(pack,{tilt:false,top:true})}</div></div>
<div class="card-stack" id="opStack" hidden></div>
<div class="op-hint" id="opHint">TAP TO OPEN</div><div class="op-tray" id="opTray"></div>
<div class="legend-banner" id="opBanner"></div><div class="flash" id="opFlash"></div></div>
<div class="op-summary" id="opSum" hidden></div>`;
    const pk=$('.pack',root);
    pk.style.setProperty('--clip-full',FULL_CLIP);
    pk.querySelector('.pack-body').style.clipPath=FULL_CLIP;
    pk.querySelector('.pack-top').style.setProperty('clip-path','var(--clip-top)');
    requestAnimationFrame(()=>root.classList.add('on'));
    this.bindPack();
    Snd.play('click');
  },
  bindPack(){
    const w=$('#opPackWrap'),pk=$('.pack',w);let sx=null;
    w.addEventListener('pointerdown',e=>{if(OP.phase!=='pack')return;sx=e.clientX;try{w.setPointerCapture(e.pointerId)}catch(_){}});
    w.addEventListener('pointermove',e=>{
      if(sx===null||OP.phase!=='pack')return;
      const dx=clamp(e.clientX-sx,-140,140);pk.style.setProperty('--drag',(dx/9).toFixed(1)+'deg');
      if(Math.abs(dx)>95){sx=null;pk.style.removeProperty('--drag');this.tear()}
    });
    const end=()=>{if(sx!==null){sx=null;pk.style.removeProperty('--drag')}};
    w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  },
  shake(big){const r=OP.root;if(!r||S.settings.reduce)return;const c=big?'shake-big':'shake';r.classList.remove('shake','shake-big');void r.offsetWidth;r.classList.add(c);this.later(()=>r.classList.remove(c),big?1000:560)},
  flash(rgb){const f=$('#opFlash');if(!f)return;if(rgb)f.style.setProperty('--rgb',rgb);f.classList.remove('go');void f.offsetWidth;f.classList.add('go')},
  tear(){
    if(OP.phase!=='pack')return;
    OP.phase='tearing';const pack=OP.pack,pk=$('.pack',OP.root),wrap=$('#opPackWrap');
    Snd.play('tear');
    const g=makeTear();pk.style.setProperty('--clip-torn',g.body);pk.style.setProperty('--clip-top',g.top);
    pk.querySelector('.pack-top').style.clipPath=g.top;
    pk.classList.add('tear');wrap.classList.add('tearing');
    $('#opHint').classList.add('off');this.shake(false);
    const r=pk.getBoundingClientRect(),tx=r.left+r.width/2,ty=r.top+r.height*.16;
    this.later(()=>{this.flash(pack.rgb);$('#opBeam').classList.add('on');FX.burst(tx,ty,{n:90,colors:pack.colors,max:760});this.shake(true)},280);
    this.later(()=>{this.showStack();FX.burst(innerWidth/2,innerHeight*.46,{n:60,colors:pack.colors,max:480})},760);
    this.later(()=>{wrap.classList.remove('tearing');wrap.classList.add('drop')},950);
    this.later(()=>{OP.phase='reveal';const h=$('#opHint');h.textContent='TAP THE CARD TO REVEAL';h.classList.remove('off')},2100);
  },
  showStack(){
    const st=$('#opStack'),pulls=OP.res.pulls;
    st.innerHTML=pulls.map((p,i)=>{
      const c=BYID.get(p.id);
      return `<div class="rc" data-i="${i}" style="z-index:${pulls.length-i};--o:${Math.min(i,4)}"><div class="rc-inner"><div class="rc-back"></div><div class="rc-front">${cardHTML(c,{shiny:p.shiny,eager:true,cls:'tilt big'})}</div></div></div>`}).join('');
    st.hidden=false;st.classList.add('rise');
  },
  offsets(){$$('.rc',OP.root).forEach(rc=>{const i=+rc.dataset.i;if(i>=OP.idx)rc.style.setProperty('--o',Math.min(i-OP.idx,4))})},
  advance(){
    if(OP.phase!=='reveal'||OP.busy)return;
    const rc=$(`.rc[data-i="${OP.idx}"]`,OP.root);if(!rc)return;
    if(!rc.classList.contains('flipped'))this.flip(rc);else this.dismiss(rc);
  },
  flip(rc){
    OP.busy=true;
    const p=OP.res.pulls[OP.idx],c=BYID.get(p.id),ri=RIDX[c.rarity],R=RARITIES[ri],n=OP.res.pulls.length,last=OP.idx===n-1,leg=c.leg&&ri>=2;
    const hype=ri>=3||leg||last||p.shiny;
    OP.root.style.setProperty('--rgb',R.rgb);rc.style.setProperty('--rgb',R.rgb);
    $('#opHint').classList.add('off');
    let pre=0;
    if(hype){pre=(last||ri>=5)?1300:900;rc.classList.add('charge');Snd.play('charge')}
    this.later(()=>{rc.classList.remove('charge');rc.classList.add('flipped');Snd.play('flip')},pre);
    this.later(()=>this.revealFx(rc,c,p,last),pre+380);
    this.later(()=>{
      OP.busy=false;const h=$('#opHint');h.textContent=last?'TAP TO SEE RESULTS':'TAP FOR NEXT CARD';h.classList.remove('off');
    },pre+1000);
  },
  revealFx(rc,c,p,last){
    const ri=RIDX[c.rarity],R=RARITIES[ri],leg=c.leg&&ri>=2;
    const lv=ri>=8?5:ri>=7?4:ri>=5?3:ri>=4?3:ri>=3?2:ri>=2?1:0;
    const b=rc.querySelector('.card').getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
    if(lv>0)Snd.play('rare',lv);
    if(ri>=2||last||p.shiny)this.flash(R.rgb);
    if(lv>=2)this.shake(lv>=4);
    if(lv>=1)FX.burst(cx,cy,{n:[0,30,60,90,150,210][lv],colors:[R.c1,R.c2,'#fff']});
    if(last)FX.burst(cx,cy,{n:60,colors:['#ffd24a','#fff0a0','#fff'],max:520});
    if(ri>=3||leg)OP.root.classList.add('rays-on');
    if(ri>=8||(p.shiny&&ri>=5))FX.confetti();
    let text='';
    if(leg){text=(p.shiny?'SHINY ':'')+'LEGENDARY';Snd.play('legend')}
    else if(p.shiny)text='✨ SHINY ✨';
    else if(lv>=3)text=R.label.toUpperCase()+'!';
    if(text){const bn=$('#opBanner');bn.textContent=text;bn.classList.remove('go');void bn.offsetWidth;bn.classList.add('go')}
    if(p.shiny&&!leg)Snd.play('rare',3);
  },
  dismiss(rc){
    OP.busy=true;OP.root.classList.remove('rays-on');
    const p=OP.res.pulls[OP.idx],c=BYID.get(p.id),R=RARITIES[RIDX[c.rarity]];
    rc.classList.add('gone');
    $('#opTray').insertAdjacentHTML('beforeend',`<div class="tr" style="--c:${R.c1}">${imgTag(c,{shiny:p.shiny,eager:true})}</div>`);
    OP.idx++;this.offsets();Snd.play('click');
    if(OP.idx>=OP.res.pulls.length){$('#opHint').classList.add('off');this.later(()=>this.showSummary(),560)}
    else this.later(()=>{OP.busy=false;const h=$('#opHint');h.textContent='TAP THE CARD TO REVEAL';h.classList.remove('off')},420);
  },
  showSummary(){
    if(OP.phase==='summary'||!OP.active)return;
    OP.phase='summary';OP.busy=false;
    $('#opStage').hidden=true;OP.root.classList.remove('rays-on');$$('.op-top',OP.root).forEach(e=>e.hidden=true);
    const sum=$('#opSum'),pulls=OP.res.pulls,pack=OP.pack,newN=pulls.filter(p=>p.isNew).length;
    const bestP=pulls.reduce((a,b)=>RIDX[BYID.get(b.id).rarity]>RIDX[BYID.get(a.id).rarity]?b:a,pulls[0]);
    const have=S.inv[pack.id]||0,canAgain=have>0||S.coins>=pack.price;
    sum.innerHTML=`<h2>✨ PACK RESULT</h2><div class="sub" style="margin:0">${esc(pack.name)}</div>
<div class="sum-grid">${pulls.map(p=>{const c=BYID.get(p.id);return `<div class="cell" data-act="detail" data-id="${c.id}" tabindex="0" role="button">${p.isNew?'<span class="new-tag">NEW</span>':''}${cardHTML(c,{shiny:p.shiny,eager:true,cls:'tilt'})}</div>`}).join('')}</div>
<div class="sum-info"><span class="chip">🆕 Kartu baru: ${newN}</span><span class="chip coin">+🪙 ${fmt(OP.res.bonus)} bonus</span><span class="chip">⭐ Terbaik: ${esc(BYID.get(bestP.id).name)}</span><span class="chip coin">🪙 ${fmt(S.coins)}</span></div>
<div class="bgrp" style="justify-content:center"><button class="btn pri xl" data-act="op-again" data-pack="${pack.id}">🔁 OPEN ANOTHER ${have?`(${have})`:`· 🪙${pack.price}`}</button><button class="btn" data-act="op-close" data-go="collection">🃏 COLLECTION</button><button class="btn" data-act="op-close">DONE</button></div>`;
    sum.hidden=false;sum.scrollTop=0;
    if(!canAgain){const b=$('[data-act="op-again"]',sum);if(b)b.classList.add('poor')}
    this.later(()=>{renderHeader();bumpCoins();flushAch()},650);
  },
  skip(){
    if(!OP.active||OP.phase==='summary')return;
    this.clearTimers();OP.busy=false;Snd.play('click');
    this.flash(OP.pack.rgb);this.showSummary();
  },
  close(goPage){
    if(!OP.active)return;
    this.clearTimers();OP.active=false;OP.phase='';
    const r=$('#opening');r.hidden=true;r.innerHTML='';r.className='opening';
    document.body.classList.remove('noscroll');
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    FX.clear();flushAch();
    if(goPage)go(goPage);else renderPage();
  }
};

/* ============================ EVENTS ============================ */
const ACTIONS={
  open:el=>startOpen(el.dataset.pack),
  buy:el=>buyPack(el.dataset.pack,false),
  buyopen:el=>buyPack(el.dataset.pack,true),
  car:el=>{UI.hero=(UI.hero+(+el.dataset.d)+PACKS.length)%PACKS.length;renderPage()},
  cardot:el=>{UI.hero=+el.dataset.v;renderPage()},
  detail:el=>openDetail(+el.dataset.id),
  dexlock:()=>toast('Pokémon ini belum ditemukan. Buka lebih banyak pack!','err'),
  sell:el=>sellCard(+el.dataset.id),
  zoom:()=>{$('#modal').classList.toggle('zoom')},
  'modal-close':()=>closeModal(),
  daily:()=>claimDaily(),
  mute:()=>{S.settings.muted=!S.settings.muted;Snd.vol();save();renderHeader();if(UI.page==='settings')renderPage()},
  set:el=>{
    const k=el.dataset.k;
    if(k==='sound'){S.settings.muted=!S.settings.muted;Snd.vol()}
    else if(k==='particles'){S.settings.particles=!S.settings.particles;FX.setParticles()}
    else if(k==='reduce'){S.settings.reduce=!S.settings.reduce;document.body.classList.toggle('reduce',S.settings.reduce)}
    save();renderPage();
  },
  theme:el=>{S.settings.theme=el.dataset.v;applySettings();save();renderPage()},
  save:()=>{toast(save()?'Game tersimpan ✔':'Penyimpanan tidak tersedia di browser ini.',save()?'ok':'err')},
  export:()=>{
    try{
      const blob=new Blob([JSON.stringify({game:'pokemon-tcg-ultimate',exported:Date.now(),data:S},null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date();
      a.download=`pokemon-tcg-save-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('Save data diekspor ✔','ok');
    }catch(e){toast('Gagal mengekspor data.','err')}
  },
  copy:async()=>{
    try{await navigator.clipboard.writeText(JSON.stringify({game:'pokemon-tcg-ultimate',exported:Date.now(),data:S}));toast('JSON disalin ke clipboard ✔','ok')}
    catch(e){toast('Clipboard tidak tersedia. Gunakan Export JSON.','err')}
  },
  import:()=>$('#importFile').click(),
  reset:async()=>{
    const ok=await confirmBox('Reset game?','Semua koin, koleksi, achievement, dan statistik akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.','Ya, hapus semua');
    if(!ok)return;
    const keep=S.settings;S=defaultState();S.settings=keep;PENDING=[];save();applySettings();closeModal();toast('Game direset. Selamat bermain lagi!','ok');renderPage();
  },
  'confirm-yes':()=>{if(UI.confirmRes){const r=UI.confirmRes;UI.confirmRes=null;$('#modal').hidden=true;$('#modalBody').innerHTML='';r(true)}},
  'confirm-no':()=>closeModal(),
  'op-skip':()=>Opening.skip(),
  'op-fs':()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}},
  'op-close':el=>Opening.close(el.dataset.go),
  'op-again':el=>{const id=el.dataset.pack,p=PACK_BY[id];
    if((S.inv[id]||0)<1&&S.coins<p.price){toast(`Koin tidak cukup untuk ${p.name}.`,'err');Snd.play('error');return}
    Opening.close();startOpen(id)}
};
document.addEventListener('click',e=>{
  Snd.init();
  const el=e.target.closest('[data-act],[data-go]');
  if(!el){
    if(OP.active&&e.target.closest('#opStage')){if(OP.phase==='pack')Opening.tear();else Opening.advance()}
    return;
  }
  if(el.dataset.act&&ACTIONS[el.dataset.act]){
    if(!['open','op-skip','op-again','op-close','zoom','op-fs'].includes(el.dataset.act))Snd.play('click');
    ACTIONS[el.dataset.act](el,e);return;
  }
  if(el.dataset.go){Snd.play('click');closeModal();go(el.dataset.go)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.col){UI.col[t.dataset.col]=t.value;renderCollectionGrid()}
  else if(t.dataset.dex){UI.dex[t.dataset.dex]=t.value;renderDexGrid()}
  else if(t.dataset.set==='volume'){S.settings.volume=clamp(+t.value/100,0,1);Snd.vol();const s=t.closest('.srow').querySelector('small');if(s)s.textContent=t.value+'%'}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set==='volume'){save();Snd.play('coin')}
  if(t.id==='importFile'&&t.files&&t.files[0]){
    const f=t.files[0],rd=new FileReader();
    rd.onload=async()=>{
      try{
        const j=JSON.parse(rd.result),raw=j&&j.data?j.data:j;
        if(!raw||typeof raw!=='object'||(!raw.cards&&raw.coins===undefined))throw new Error('format');
        const ok=await confirmBox('Import save data?','Progres saat ini akan digantikan oleh data dari file.','Ya, import');
        if(!ok)return;
        S=sanitize(raw);save();applySettings();toast('Import berhasil ✔','ok');renderPage();
      }catch(err){toast('File tidak valid. Pastikan file JSON hasil export game ini.','err')}
    };
    rd.onerror=()=>toast('Gagal membaca file.','err');
    rd.readAsText(f);t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();return}
  const el=e.target.closest&&e.target.closest('[data-act][role="button"]');
  if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click();return}
  if(OP.active&&(e.key===' '||e.key==='Enter')&&e.target===document.body&&$('#modal').hidden){
    e.preventDefault();if(OP.phase==='pack')Opening.tear();else Opening.advance();
  }
});
document.addEventListener('pointerdown',()=>Snd.init(),{passive:true});
/* efek tilt 3D & kilau holografik */
let tiltEl=null;
function resetTilt(el){el.classList.remove('tilting');['--rx','--ry'].forEach(k=>el.style.removeProperty(k))}
document.addEventListener('pointermove',e=>{
  const el=e.target.closest&&e.target.closest('.tilt');
  if(tiltEl&&tiltEl!==el){resetTilt(tiltEl);tiltEl=null}
  if(!el)return;
  tiltEl=el;const r=el.getBoundingClientRect(),px=clamp((e.clientX-r.left)/r.width,0,1),py=clamp((e.clientY-r.top)/r.height,0,1),k=S.settings.reduce?.4:1;
  el.style.setProperty('--rx',((.5-py)*22*k).toFixed(2)+'deg');el.style.setProperty('--ry',((px-.5)*24*k).toFixed(2)+'deg');
  el.style.setProperty('--tx',(px*100).toFixed(1)+'%');el.style.setProperty('--ty',(py*100).toFixed(1)+'%');
  el.style.setProperty('--bx',(px*100).toFixed(1)+'%');el.style.setProperty('--by',(py*100).toFixed(1)+'%');
  el.classList.add('tilting');
},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(tiltEl){resetTilt(tiltEl);tiltEl=null}}));
document.documentElement.addEventListener('mouseleave',()=>{if(tiltEl){resetTilt(tiltEl);tiltEl=null}});
addEventListener('hashchange',route);
addEventListener('beforeunload',()=>{if(S)save()});
addEventListener('resize',()=>document.documentElement.style.setProperty('--vh',(innerHeight*.01)+'px'));

/* ============================ INIT ============================ */
function init(){
  Store.init();
  const raw=Store.read();
  S=raw?sanitize(raw):defaultState();
  if(!raw)save();
  if(!Store.ok)setTimeout(()=>toast('localStorage tidak tersedia — progres tidak akan tersimpan setelah menutup halaman.','err',5000),600);
  document.documentElement.style.setProperty('--clip-full',FULL_CLIP);
  FX.init();applySettings();
  PACKS.forEach(p=>{const i=new Image();i.src=art(p.mascot)});
  route();
  if(S.daily.last!==todayKey())setTimeout(()=>toast('🎁 Hadiah harian menunggu di halaman Home!','ok',3200),900);
}
init();
</script>
